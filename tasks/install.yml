---
- name: Ensure Linkwarden paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ linkwarden_uid }}"
    group: "{{ linkwarden_gid }}"
  with_items:
    - "{{ linkwarden_base_path }}"
    - "{{ linkwarden_data_path }}"

- name: Ensure Linkwarden support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ linkwarden_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ linkwarden_uid }}"
    group: "{{ linkwarden_gid }}"
  with_items:
    - env
    - labels
  register: linkwarden_support_files_result

- name: Run if self-building of Linkwarden container image is not enabled
  when: "not linkwarden_container_image_self_build | bool"
  block:
    - name: Ensure Linkwarden container image is pulled via community.docker.docker_image
      when: sysd_docker_image_pull_method == 'ansible-module'
      community.docker.docker_image:
        name: "{{ linkwarden_container_image }}"
        source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"
        force_source: "{{ linkwarden_container_image_force_pull if ansible_version.major > 2 or ansible_version.minor >= 8 else omit }}"
        force: "{{ omit if ansible_version.major > 2 or ansible_version.minor >= 8 else linkwarden_container_image_force_pull }}"
      register: linkwarden_container_image_pull_result
      retries: "{{ container_retry }}"
      delay: "{{ container_retry_delay }}"
      until: linkwarden_container_image_pull_result is not failed

    - name: Ensure Linkwarden container image is pulled via ansible.builtin.command
      when: sysd_docker_image_pull_method == 'command'
      ansible.builtin.command:
        cmd: "{{ sysd_docker_host_command }} pull {{ linkwarden_container_image }}"
      register: linkwarden_container_image_pull_result
      retries: "{{ container_retry }}"
      delay: "{{ container_retry_delay }}"
      until: linkwarden_container_image_pull_result is not failed
      changed_when: "'Downloaded newer image' in linkwarden_container_image_pull_result.stdout"

- name: Run if self-building of Linkwarden container image is enabled
  when: "linkwarden_container_image_self_build | bool"
  block:
    - name: Ensure Linkwarden repository is present on self-build
      ansible.builtin.git:
        repo: "{{ linkwarden_container_image_self_build_repo }}"
        version: "{{ linkwarden_container_image_self_build_repo_version }}"
        dest: "{{ linkwarden_container_image_self_build_src_files_path }}"
        force: "yes"
      register: linkwarden_git_pull_results

    # Invoking the `docker build` command here, instead of calling the `docker_image` Ansible module,
    # because the latter does not support BuildKit.
    # See: https://github.com/ansible-collections/community.general/issues/514
    - name: Ensure Linkwarden container image is built
      ansible.builtin.shell:
        chdir: "{{ linkwarden_container_image_self_build_src_files_path }}"
        cmd: |
          {{ sysd_docker_host_command }} build \
          -t "{{ linkwarden_container_image_self_build_name }}" \
          -f Dockerfile \
          .
      environment:
        DOCKER_BUILDKIT: "1"
        PYTHON: "/usr/bin/python3"
      register: linkwarden_container_image_build_result
      changed_when: "'Successfully built' in linkwarden_container_image_build_result.stdout or ('writing image' in linkwarden_container_image_build_result.stderr and 'CACHED' not in linkwarden_container_image_build_result.stderr)"

- name: Ensure Linkwarden container network is created via community.docker.docker_network
  when: sysd_docker_net_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ sysd_docker_ipv6_enabled }}"
    name: "{{ linkwarden_container_network }}"
    driver: bridge
    driver_options: "{{ sysd_docker_net_driver_opts }}"
  register: linkwarden_network_creation_result

- name: Ensure Linkwarden container network is created via ansible.builtin.command
  when: sysd_docker_net_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ sysd_docker_host_command }} network create
      {% if sysd_docker_ipv6_enabled %}--ipv6{% endif %}
      {{ sysd_docker_net_driver_opts_string }}
      {{ linkwarden_container_network }}
  register: linkwarden_network_creation_result
  changed_when: linkwarden_network_creation_result.rc == 0
  failed_when: linkwarden_network_creation_result.rc != 0 and 'already exists' not in linkwarden_network_creation_result.stderr

- name: Ensure Linkwarden systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/linkwarden.service.j2"
    dest: "{{ sysd_docker_service_path }}/{{ linkwarden_identifier }}.service"
    mode: "0644"
  register: linkwarden_systemd_service_result

- name: Determine whether Linkwarden needs a restart
  ansible.builtin.set_fact:
    linkwarden_restart_necessary: >-
      {{
        linkwarden_support_files_result.changed | default(false)
        or linkwarden_systemd_service_result.changed | default(false)
        or linkwarden_container_image_pull_result.changed | default(false)
        or linkwarden_container_image_build_result.changed | default(false)
      }}
