---
- name: Check existence of Linkwarden systemd service
  ansible.builtin.stat:
    path: "{{ sysd_docker_service_path }}/{{ linkwarden_identifier }}.service"
  register: linkwarden_service_stat

- name: Uninstall Linkwarden systemd services and files
  when: linkwarden_service_stat.stat.exists | bool
  block:
    - name: Ensure Linkwarden systemd service is stopped
      ansible.builtin.service:
        name: "{{ linkwarden_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure Linkwarden systemd service does not exist
      ansible.builtin.file:
        path: "{{ sysd_docker_service_path }}/{{ linkwarden_identifier }}.service"
        state: absent

    - name: Ensure Linkwarden support files do not exist
      ansible.builtin.file:
        path: "{{ linkwarden_base_path }}/{{ item }}"
        state: absent
      with_items:
        - env
        - labels

    - name: Ensure Linkwarden image source files path does not exist
      ansible.builtin.file:
        path: "{{ linkwarden_container_image_self_build_src_files_path }}"
        state: absent

    - name: Ensure Linkwarden local data path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ linkwarden_data_path }}"
      register: linkwarden_data_path_deletion_result
      changed_when: linkwarden_data_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure Linkwarden base path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ linkwarden_base_path }}"
      register: linkwarden_base_path_deletion_result
      changed_when: linkwarden_base_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure Linkwarden container network does not exist
      when: linkwarden_container_network_deletion_enabled
      block:
        - name: Ensure Linkwarden container network does not exist via community.docker.docker_network
          when: sysd_docker_net_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ linkwarden_container_network }}"
            state: absent
          register: linkwarden_network_deletion_result

        - name: Ensure Linkwarden container network does not exist via ansible.builtin.command
          when: sysd_docker_net_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ sysd_docker_host_command }} network rm
              {{ linkwarden_container_network }}
          register: linkwarden_network_deletion_result
          changed_when: linkwarden_container_network in linkwarden_network_deletion_result.stdout

- name: Check existence of Linkwarden local data path
  ansible.builtin.stat:
    path: "{{ linkwarden_data_path }}"
  register: linkwarden_data_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Notify if Linkwarden local data remains
  when: linkwarden_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    runtime_messages_list: |
      {{
        runtime_messages_list | default([])
        +
        [
          "Note: As the local Linkwarden instance has been removed, some old data remains in `" + linkwarden_data_path + "`. Feel free to delete it."
        ]
      }}
